# Auto-deploy Saarthi to the CloudPanel VPS on every push to main.
# GitHub builds and checks everything first. If any step fails, the server is
# never touched. The server then smoke-tests the new release before going live.
name: Deploy Saarthi

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

# Never run two deploys at the same time
concurrency:
  group: deploy-saarthi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js (MUST match `node -v` on the server)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ---------- Frontend: build the React app ----------
      # VITE_API_URL / VITE_SOCKET_URL are NOT set on purpose: the app then
      # uses its own address (same domain), which is how Saarthi is served.
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

      - name: Check the website was built
        run: test -f frontend/dist/index.html || (echo "frontend/dist/index.html missing" && exit 1)

      # The backend serves the React app from backend/public
      - name: Copy the website into backend/public
        run: |
          rm -rf backend/public
          cp -r frontend/dist backend/public

      # ---------- Backend: make sure it installs and has no syntax errors ----------
      - name: Check backend packages install
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check backend code for syntax errors
        working-directory: backend
        run: find src -name "*.js" -print0 | xargs -0 -n1 node --check

      # ---------- Pack everything into one file ----------
      - name: Create release package
        run: |
          tar -czf release.tar.gz \
            backend/package.json backend/package-lock.json backend/src backend/public
          ls -lh release.tar.gz

      # ---------- Send it to the server ----------
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "${{ github.sha }}" < release.tar.gz

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key